<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Produtos - SAEP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topo">
    <h1>Cadastro de Produto</h1>
    <div>
      <span>Usuário: <strong id="usuario-nome"></strong></span>
      <a href="index.html">Voltar</a>
      <button onclick="deslogar()">Sair</button>
    </div>
  </div>

  <div id="aviso-global" class="msg-sucesso"></div>

  <div class="painel">
    <h2 id="titulo-form">Novo Produto</h2>
    <div id="aviso-form" class="msg-erro"></div>
    <form id="form-produto">
      <input type="hidden" id="prod-id">

      <div class="linha">
        <div class="campo" style="flex: 2;">
          <label>Nome do Produto *</label>
          <input type="text" id="prod-nome" required>
        </div>
        <div class="campo">
          <label>Validade</label>
          <input type="date" id="prod-validade">
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label>Cor</label>
          <input type="text" id="prod-cor">
        </div>
        <div class="campo" id="campo-qtd-inicial">
          <label>Quantidade Inicial</label>
          <input type="number" step="0.01" id="prod-qtd" value="0">
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label>Unidade *</label>
          <input type="text" id="prod-unidade" value="un" required>
        </div>
      </div>

      <div style="margin-top: 10px;">
        <button type="submit" class="btn-acao" id="btn-salvar", onclick=cadastrarProduto()>Salvar Produto</button>
        <button type="button" class="btn-acao" id="btn-cancelar" style="background: #6c757d; display: none;" onclick="resetarFormulario()">Cancelar Edição</button>
      </div>
    </form>
  </div>

  <div class="painel">
    <h2>Produtos Cadastrados</h2>
    <div class="linha">
      <input type="text" id="busca-nome" placeholder="Digite o nome para pesquisar..." style="flex: 1;">
      <button type="button" class="btn-acao" onclick="buscarProdutos()">Buscar</button>
      <button type="button" class="btn-acao" style="background: #6c757d;" onclick="limparBusca()">Todos</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Validade</th>
          <th>Cor</th>
          <th>Quantidade</th>
          <th>Unidade</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="lista-produtos">
        <tr>
          <td colspan="11" style="text-align: center;">Carregando produtos...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/produtos.js"></script>
</body>
</html>
